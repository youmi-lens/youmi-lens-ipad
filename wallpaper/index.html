(() => {
  // ?lock: layout for the macOS lock screen (room for the system clock up top, no clock of ours)
  const LOCK = new URLSearchParams(location.search).has('lock');
  const L = LOCK ? { h: .5, cy: .57 } : { h: .64, cy: .43 };
  if (LOCK) document.documentElement.classList.add('lock');
  const tEl = document.getElementById('t');
  const tick = () => { tEl.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }); };
  tick(); setInterval(tick, 1000);

  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const rand = (a, b) => a + Math.random() * (b - a);
  const mouse = { x: -1e4, y: -1e4, sx: -1e4, sy: -1e4 };
  addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  addEventListener('mouseout', () => { mouse.x = mouse.y = -1e4; });

  let W, H, U, pts = [], dust = [], markImg, logo = {};

  // particle homes are sampled from the logo's alpha; size everything off U (1 at 1080p, 2 at 4K)
  function build() {
    const h = H * L.h, w = h * markImg.width / markImg.height;
    logo = { x: W / 2 - w / 2, y: H * L.cy - h / 2, w, h };
    const sw = Math.round(w), sh = Math.round(h);
    const off = document.createElement('canvas'); off.width = sw; off.height = sh;
    const o = off.getContext('2d'); o.drawImage(markImg, 0, 0, sw, sh);
    const data = o.getImageData(0, 0, sw, sh).data;

    const glow = document.createElement('canvas'), pad = Math.round(60 * U);
    glow.width = sw + pad * 2; glow.height = sh + pad * 2;
    const g = glow.getContext('2d'); g.filter = `blur(${24 * U}px)`; g.drawImage(markImg, pad, pad, sw, sh);
    g.filter = 'none'; g.globalCompositeOperation = 'source-in'; g.fillStyle = '#3d86ff'; g.fillRect(0, 0, glow.width, glow.height);
    logo.glow = glow; logo.pad = pad;

    const step = Math.max(2, Math.sqrt(sw * sh * .3 / 26000)), homes = [];
    for (let fy = 0; fy < sh; fy += step) for (let fx = 0; fx < sw; fx += step) {
      if (data[((fy | 0) * sw + (fx | 0)) * 4 + 3] > 120) homes.push([logo.x + fx + rand(-step / 2, step / 2), logo.y + fy + rand(-step / 2, step / 2)]);
    }
    pts = homes.map(([hx, hy]) => ({ hx, hy, x: hx + rand(-W, W) * .4, y: hy + rand(-H, H) * .4, vx: 0, vy: 0, s: rand(.5, 1.5), ph: rand(0, 6.28), b: rand(.8, 1) }));
    dust = Array.from({ length: 90 }, () => ({ x: rand(0, W), y: rand(0, H), z: rand(.3, 1), ph: rand(0, 6.28) }));
  }
  function resize() {
    const dpr = devicePixelRatio || 1;
    W = innerWidth; H = innerHeight; U = H / 1080;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (markImg) build();
  }
  addEventListener('resize', resize); resize();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, .05); last = now; const t = now / 1000;
    mouse.sx += (mouse.x - mouse.sx) * .2; mouse.sy += (mouse.y - mouse.sy) * .2;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    const bgG = ctx.createRadialGradient(W / 2, H * .45, 0, W / 2, H * .45, H * .8);
    bgG.addColorStop(0, 'rgba(20,45,110,.35)'); bgG.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bgG; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    // faint breathing glow behind the mark
    ctx.globalAlpha = .6 + .15 * Math.sin(t * .8);
    ctx.drawImage(logo.glow, logo.x - logo.pad, logo.y - logo.pad);
    ctx.globalAlpha = 1;

    // sparse slow dust
    for (const d of dust) {
      d.y -= d.z * 6 * U * dt; if (d.y < 0) { d.y = H; d.x = rand(0, W); }
      ctx.fillStyle = `rgba(150,180,230,${(.2 + .2 * Math.sin(t * .7 + d.ph)) * d.z})`;
      ctx.fillRect(d.x, d.y, 1.4 * U, 1.4 * U);
    }

    // particles: spring home + gentle drift + mouse nudge
    const R = 140 * U, drift = 1.2 * U;
    const sweep = ((t % 9) / 9) * 1.6 - .3; // slow light pass, top-left to bottom-right
    const size = 1.9 * U;
    for (const p of pts) {
      const hx = p.hx + Math.sin(t * p.s + p.ph) * drift, hy = p.hy + Math.cos(t * p.s * 1.2 + p.ph) * drift;
      let ax = (hx - p.x) * 6, ay = (hy - p.y) * 6;
      const mx = p.x - mouse.sx, my = p.y - mouse.sy, md = mx * mx + my * my;
      if (md < R * R) { const m = Math.sqrt(md) + .1, f = (1 - m / R) * 2600 * U; ax += mx / m * f; ay += my / m * f; }
      p.vx = (p.vx + ax * dt) * .9; p.vy = (p.vy + ay * dt) * .9;
      p.x += p.vx * dt; p.y += p.vy * dt;

      const u = ((p.hx - logo.x) / logo.w + (p.hy - logo.y) / logo.h) / 2;
      const hl = Math.max(0, 1 - Math.abs(u - sweep) / .08);
      const a = p.b * (.85 + .15 * Math.sin(t * 1.5 * p.s + p.ph)) + hl * .6;
      ctx.fillStyle = `rgba(${225 + 30 * hl | 0},${236 + 19 * hl | 0},255,${Math.min(1, a)})`;
      ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
    }
    requestAnimationFrame(frame);
  }

  markImg = new Image();
  markImg.onload = () => { build(); requestAnimationFrame(frame); };
  markImg.src = MARK;
})();
