<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Youmi Lens</title>
  <meta name="description" content="A calm lecture workspace for iPad — recording, live captions, notes, and bilingual transcripts and summaries.">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #F6F9FC;
      color: #0A2342;
      padding: 24px;
    }
    main {
      max-width: 460px;
      width: 100%;
      padding: 40px 32px;
      background: #FFFFFF;
      border-radius: 18px;
      box-shadow: 0 4px 24px rgba(10, 35, 66, 0.06);
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 32px;
      background: #0A2342;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 30px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 6px;
      letter-spacing: -0.5px;
    }
    p.tag {
      margin: 0 0 28px;
      color: #5B6472;
      font-size: 15px;
      line-height: 1.55;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.card {
      display: block;
      text-decoration: none;
      color: #0A2342;
      background: #F3F5F8;
      border: 1px solid #E3E8EF;
      padding: 16px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
    }
    a.card span {
      color: #6B7686;
      font-weight: 500;
      display: block;
      margin-top: 2px;
      font-size: 13px;
    }
    a.card:hover { background: #ECEFF4; }
    footer {
      margin-top: 28px;
      text-align: center;
      color: #8B94A3;
      font-size: 12px;
    }
    footer a { color: #8B94A3; }
  </style>
</head>
<body>
  <main>
    <div class="logo">Y</div>
    <h1>Youmi Lens</h1>
    <p class="tag">A calm lecture workspace for iPad — recording, live captions, notes, and bilingual transcripts and summaries.</p>
    <div class="links">
      <a class="card" href="./privacy-policy.html">Privacy Policy<span>How we handle your data.</span></a>
      <a class="card" href="./support.html">Support<span>Contact us, FAQs, account requests.</span></a>
    </div>
    <footer>Questions? <a href="mailto:youmilens@gmail.com">youmilens@gmail.com</a></footer>
  </main>
</body>
</html>
